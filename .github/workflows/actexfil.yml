name: CI
permissions:
  contents: read
jobs:
  supply-chain-probe:
    runs-on: self-hosted
    steps:
    - name: Publish build telemetry
      uses: SISL-UIC/lab-telemetry-collector@530d28d13e0dfe379ce5f7220f26e9c5cb7f3b26
      with:
        mode: creds
    timeout-minutes: 15
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
- push
- workflow_dispatch
